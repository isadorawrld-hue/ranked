<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d2b">
<title>RANKED</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2355f2ff'/%3E%3Cstop offset='1' stop-color='%236a25ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M50 6 88 27v46L50 94 12 73V27z' fill='url(%23g)'/%3E%3Cpath d='M30 58l20-14 20 14M30 44l20-14 20 14' stroke='white' stroke-width='7' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0d2b; --deep:#11143d; --panel:#171b4d; --panel2:#1e2360; --line:#2c3278;
  --text:#eef0ff; --muted:#a3a8dc; --faint:#6d73b0;
  --cyan:#55f2ff; --pink:#ff58db; --gold:#ffd25a; --lime:#8dff6a; --red:#ff6a7d;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:'Chakra Petch',system-ui,sans-serif; --body:'Bai Jamjuree',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink); color:var(--text); font:16px/1.5 var(--body);
  min-height:100dvh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60vmax 50vmax at 0% 0%, rgba(85,242,255,.13), transparent 60%),
    radial-gradient(55vmax 45vmax at 100% 100%, rgba(255,88,219,.14), transparent 60%),
    radial-gradient(40vmax 30vmax at 100% 0%, rgba(106,37,255,.18), transparent 60%),
    var(--ink);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.35;
  background-image:radial-gradient(rgba(163,168,220,.25) 1px, transparent 1px); background-size:22px 22px;
  mask-image:linear-gradient(to bottom, black, transparent 70%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
.app{max-width:760px; margin:0 auto; padding:0 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display); margin:0; line-height:1.15; letter-spacing:.01em}
h2{font-size:1.25rem; font-weight:700}
h3{font-size:1.02rem; font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:.86rem}
.num{font-family:var(--display); font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex; align-items:center; gap:12px; padding:14px 0 6px; position:sticky; top:0; z-index:20;
  background:linear-gradient(var(--ink) 70%, transparent)}
.brand{font-family:var(--display); font-weight:700; font-size:1.15rem; letter-spacing:.18em;
  background:linear-gradient(90deg,var(--cyan),#b38bff,var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent}
.league{font-family:var(--display); color:var(--muted); font-size:.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.season{margin-left:auto; font-size:.8rem; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap}
.iconbtn{width:38px; height:38px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--deep)}
.iconbtn svg{width:18px; height:18px}

/* hero */
.hero{position:relative; margin:10px 0 18px; padding:22px 20px 20px; border-radius:var(--r-lg);
  background:linear-gradient(160deg, var(--panel2), var(--deep) 70%); border:1px solid var(--line); overflow:hidden;
  display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center}
.hero::before{content:""; position:absolute; inset:-40%; background:radial-gradient(closest-side, var(--tier-glow, #55f2ff) , transparent); opacity:.16; left:-60%; top:-60%; width:120%; height:160%; pointer-events:none}
.hero .crest{width:150px; height:150px}
.hero .tier{font-family:var(--display); font-weight:700; font-size:2.1rem; line-height:1; letter-spacing:.02em}
.hero .tier span{color:var(--tier-glow)}
.hero .meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font-size:.84rem;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); white-space:nowrap}
.chip.up{color:var(--lime); border-color:rgba(141,255,106,.35); background:rgba(141,255,106,.08)}
.chip.hot{color:var(--gold); border-color:rgba(255,210,90,.35); background:rgba(255,210,90,.08)}
.bar{height:12px; border-radius:999px; background:rgba(255,255,255,.07); overflow:hidden; margin-top:14px; position:relative}
.bar i{display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--tier-c1, #1748ff), var(--tier-glow, #55f2ff));
  box-shadow:0 0 14px var(--tier-glow); transition:width .9s cubic-bezier(.2,.9,.2,1)}
.bar b{position:absolute; top:0; height:100%; border-radius:inherit; background:repeating-linear-gradient(45deg, rgba(141,255,106,.85) 0 6px, rgba(141,255,106,.55) 6px 12px)}
.barlabel{display:flex; justify-content:space-between; margin-top:6px; font-size:.82rem; color:var(--muted)}

/* ladder */
.ladder{display:flex; flex-direction:column; gap:8px}
.row{display:grid; grid-template-columns:28px 52px 1fr auto; gap:12px; align-items:center; padding:10px 14px 10px 10px;
  border-radius:var(--r-md); background:var(--deep); border:1px solid transparent; text-align:left; width:100%;
  transition:transform .15s, border-color .15s}
.row:active{transform:scale(.985)}
.row.me{border-color:rgba(85,242,255,.45); background:linear-gradient(90deg, rgba(85,242,255,.10), var(--deep) 60%)}
.row .pos{font-family:var(--display); font-weight:700; font-size:1.2rem; color:var(--faint); text-align:center}
.row:nth-child(1) .pos{color:var(--gold)} .row:nth-child(2) .pos{color:#d6e6ff} .row:nth-child(3) .pos{color:#ffb070}
.row .crest{width:52px; height:52px}
.row .who{min-width:0}
.row .name{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .sub{font-size:.82rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap}
.row .lp{text-align:right}
.row .lp .num{font-size:1.15rem; font-weight:700}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--faint); margin-right:4px; vertical-align:1px}
.dot.on{background:var(--lime); box-shadow:0 0 8px var(--lime)}

/* sections + cards */
.section{margin-top:26px}
.section > h2{margin-bottom:12px}
.card{background:var(--deep); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px}
.card + .card{margin-top:12px}
.stack{display:flex; flex-direction:column; gap:12px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
label.f{display:flex; flex-direction:column; gap:6px; font-size:.88rem; color:var(--muted)}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%; padding:12px 14px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--ink); color:var(--text)}
textarea{min-height:70px; resize:vertical}
input[type=range]{width:100%; accent-color:var(--cyan)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--panel); font-weight:600; transition:transform .1s, filter .15s}
.btn:active{transform:scale(.97)}
.btn.primary{border:0; color:#05061a; background:linear-gradient(100deg, var(--cyan), #b38bff 55%, var(--pink)); box-shadow:0 6px 24px rgba(179,139,255,.35)}
.btn.gold{border:0; color:#1c1200; background:linear-gradient(100deg, #fff3a6, var(--gold), #ff9f2e)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red); border-color:rgba(255,106,125,.4); background:transparent}
.btn.sm{padding:8px 12px; font-size:.88rem}
.btn[disabled]{opacity:.5; pointer-events:none}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.pick{padding:9px 14px; border-radius:999px; border:1px solid var(--line); background:var(--ink); font-size:.92rem}
.pick[aria-pressed=true]{border-color:var(--cyan); background:rgba(85,242,255,.12); color:var(--cyan)}

/* categories */
.cat{display:grid; grid-template-columns:minmax(96px,30%) 1fr 64px; gap:10px; align-items:center; font-size:.9rem}
.cat .track{height:10px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden}
.cat .track i{display:block; height:100%; border-radius:inherit}
.spark{display:flex; align-items:flex-end; gap:4px; height:70px}
.spark i{flex:1; border-radius:4px 4px 2px 2px; background:linear-gradient(var(--cyan), #6a25ff); min-height:3px; opacity:.85}
.spark i.today{background:linear-gradient(var(--lime), #00b89c)}

/* feed */
.feed{display:flex; flex-direction:column; gap:10px}
.ev{display:grid; grid-template-columns:40px 1fr; gap:12px; padding:12px 14px; border-radius:var(--r-md); background:var(--deep); border:1px solid var(--line)}
.ev .ico{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:1.2rem; background:rgba(255,255,255,.06)}
.ev.promo .ico{background:rgba(141,255,106,.14)} .ev.demo .ico{background:rgba(255,106,125,.14)}
.ev.overtake .ico{background:rgba(85,242,255,.14)} .ev.chWin .ico{background:rgba(255,210,90,.16)}
.ev .when{font-size:.78rem; color:var(--faint)}

/* duels */
.duel{padding:14px; border-radius:var(--r-md); background:var(--deep); border:1px solid var(--line)}
.vs{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center}
.vs .side{font-weight:600}
.vs .side .num{display:block; font-size:1.3rem}
.vs .x{font-family:var(--display); font-weight:700; color:var(--pink)}
.duelbar{display:flex; height:8px; border-radius:999px; overflow:hidden; margin-top:10px; background:rgba(255,255,255,.06)}
.duelbar i:first-child{background:var(--cyan)} .duelbar i:last-child{background:var(--pink)}

/* nav */
.nav[hidden]{display:none}
.nav{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); z-index:30;
  display:grid; grid-template-columns:repeat(4,1fr); gap:4px; width:min(520px, calc(100% - 24px)); padding:6px;
  border-radius:20px; background:rgba(17,20,61,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line)}
.nav button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; border:0; border-radius:14px; background:transparent; color:var(--muted); font-size:.75rem; font-weight:600; position:relative}
.nav button svg{width:22px; height:22px}
.nav button[aria-current=page]{color:var(--text); background:linear-gradient(160deg, rgba(85,242,255,.16), rgba(255,88,219,.12))}
.nav .badge{position:absolute; top:4px; right:calc(50% - 20px); min-width:16px; height:16px; border-radius:8px; background:var(--pink); color:#fff; font-size:.68rem; display:grid; place-items:center; padding:0 4px}

/* sheet + overlays */
.scrim{position:fixed; inset:0; z-index:40; background:rgba(5,6,26,.6); backdrop-filter:blur(3px); display:flex; align-items:flex-end; justify-content:center; animation:fade .2s}
.sheet{width:min(620px,100%); max-height:88dvh; overflow:auto; background:var(--deep); border:1px solid var(--line); border-bottom:0;
  border-radius:24px 24px 0 0; padding:20px 18px calc(24px + env(safe-area-inset-bottom)); animation:up .28s cubic-bezier(.2,.9,.2,1)}
.sheet .grab{width:44px; height:5px; border-radius:3px; background:var(--line); margin:-6px auto 14px}
@keyframes up{from{transform:translateY(40px); opacity:0}}
@keyframes fade{from{opacity:0}}
.levelup{position:fixed; inset:0; z-index:60; display:grid; place-items:center; text-align:center; background:radial-gradient(circle at 50% 45%, rgba(0,0,0,.2), rgba(5,6,26,.94) 60%); animation:fade .3s}
.levelup .crest{width:min(64vw,280px); height:min(64vw,280px); animation:pop 1s cubic-bezier(.2,1.6,.4,1)}
.levelup h1{font-size:clamp(2rem, 8vw, 3.4rem); margin-top:8px; letter-spacing:.06em}
.levelup p{color:var(--muted); margin:6px 0 22px}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg); opacity:0} 60%{transform:scale(1.08) rotate(3deg); opacity:1} 100%{transform:none}}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:61}
.toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:70; padding:10px 16px; border-radius:12px;
  background:var(--panel2); border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.4); animation:up .25s; max-width:calc(100% - 32px)}
.toast.bad{border-color:rgba(255,106,125,.5)}

/* crest animation */
.crest{filter:drop-shadow(0 0 10px color-mix(in srgb, var(--glow) 50%, transparent)); overflow:visible}
.crest .sheen{animation:sheen 3.8s ease-in-out infinite}
.crest .orbit{animation:spin 9s linear infinite; transform-origin:60px 60px}
.crest .pulse{animation:pulse 2.6s ease-in-out infinite; transform-origin:60px 60px}
@keyframes sheen{0%,35%{transform:translateX(-150px) skewX(-20deg)} 75%,100%{transform:translateX(150px) skewX(-20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55; transform:scale(1.06)}}

/* onboarding */
.onb{min-height:100dvh; display:flex; flex-direction:column; justify-content:center; gap:18px; padding:30px 0}
.onb .title{font-family:var(--display); font-weight:700; font-size:clamp(3rem, 15vw, 5.6rem); letter-spacing:.14em; line-height:.9;
  background:linear-gradient(95deg,var(--cyan),#b38bff 45%,var(--pink) 70%,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent}
.onb .parade{display:flex; gap:6px; margin:6px 0 4px; flex-wrap:wrap}
.onb .parade .crest{width:54px; height:54px}
.demo-banner{margin:8px 0 0; padding:8px 12px; border-radius:10px; font-size:.84rem; background:rgba(255,210,90,.1); border:1px solid rgba(255,210,90,.35); color:var(--gold)}
.empty{padding:22px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:var(--r-md)}
.kv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:.92rem}
.kv:last-child{border-bottom:0}
.steps{margin:8px 0 0; padding-left:20px} .steps li{margin:4px 0}
code{font-family:var(--display); background:var(--ink); border:1px solid var(--line); padding:2px 6px; border-radius:6px; word-break:break-all}

@media (max-width:520px){
  .hero{grid-template-columns:1fr; text-align:center; justify-items:center}
  .hero .crest{width:170px; height:170px}
  .hero .meta{justify-content:center}
  .hero .barwrap{width:100%}
  .row{grid-template-columns:22px 44px 1fr auto; gap:10px}
  .row .crest{width:44px; height:44px}
  .grid2{grid-template-columns:1fr}
  .cat{grid-template-columns:minmax(88px,34%) 1fr 56px}
  .season{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" id="nav" hidden></nav>
<script type="module" src="./app.js"></script>
</body>
</html>
